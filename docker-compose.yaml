services:
  php_fpm_1:
    build:
      context: ./containers/fpm
      dockerfile: Dockerfile
    container_name: php_fpm_1
    volumes:
      - .:/var/www:cached
    environment:
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      memcached:
        condition: service_started
    networks:
      - app-net

  php_fpm_2:
    build:
      context: ./containers/fpm
      dockerfile: Dockerfile
    container_name: php_fpm_2
    volumes:
      - .:/var/www:cached
    environment:
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      memcached:
        condition: service_started
    networks:
      - app-net

  nginx:
    build: ./containers/nginx
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      # Важно: именно ./src и именно /var/www/html
      - ./src:/var/www/html:cached
      # Конфиг nginx тоже должен лежать здесь и быть read-only
      # - ./containers/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php_fpm_1:
        condition: service_started
      php_fpm_2:
        condition: service_started
    networks:
      - app-net

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    volumes:
      - ./containers/postgres/data:/var/lib/postgresql/data
      - ./containers/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # если есть
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - ./containers/redis/data:/data
    networks:
      - app-net

  memcached:
    image: memcached:1.6-alpine
    container_name: memcached
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
