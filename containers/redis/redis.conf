# Redis конфигурация
bind 0.0.0.0
port 6379
daemonize no
protected-mode yes
requirepass redis_password

# Персистентность
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Память
maxmemory 256mb
maxmemory-policy allkeys-lru

# Логи
loglevel notice
logfile ""

# Сеть
timeout 0
tcp-keepalive 300

# База данных
databases 16
save 900 1
save 300 10
save 60 10000

# Другие настройки
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data